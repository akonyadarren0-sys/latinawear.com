<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LATINA Wear</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{--bg:#000;--ink:#ede8df;--red:#8b0000;--glow:0 0 22px rgba(139,0,0,.75),0 0 2px rgba(139,0,0,.9);--ti:'Cinzel','Bodoni Moda',Georgia,serif;--bo:'Cormorant Garamond','Italiana',Georgia,serif;}
body {
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--bo);
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
}
h1 {
  font-family: var(--ti);
  font-size: 3rem;
  letter-spacing: 0.2em;
  margin-bottom: 10px;
  text-shadow: var(--glow);
}
p {
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  color: #bfa8a8;
}
</style>
</head>
<body>

  <h1>LATINA WEAR</h1>
  <p>Bold, Beautiful, and Authentic Style</p>

</body>
</html>
